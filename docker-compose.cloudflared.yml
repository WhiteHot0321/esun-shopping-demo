# Named Cloudflare Tunnel overlay (stable public hostname) for tunnel mode. Use it together with docker-compose.tunnel.yml:
#
#   docker compose -p esun-tunnel -f docker-compose.prod.yml -f docker-compose.tunnel.yml -f docker-compose.cloudflared.yml \
#     --env-file .env.prod up -d --build
#
# One-time Cloudflare setup (dashboard, see docs/tasks/076-cloudflare-named-tunnel.md): Zero Trust -> Networks -> Tunnels ->
# create a tunnel, copy its token into .env.prod as CLOUDFLARE_TUNNEL_TOKEN, add a Public Hostname (your domain) whose
# service is `http://caddy:80`. Set CORS_ALLOWED_ORIGINS in .env.prod to that https origin.
#
# cloudflared dials OUT to Cloudflare, so nothing needs to be published on the host; it joins only the `edge` network and
# can reach Caddy but not MySQL/Redis/Ollama. The token is a secret: .env.prod only, never committed.
services:
  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    command: ["tunnel", "--no-autoupdate", "--protocol", "${CLOUDFLARED_PROTOCOL:-http2}", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env.prod (Cloudflare Zero Trust tunnel token)}
    networks: [edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    depends_on:
      - caddy
    restart: unless-stopped
