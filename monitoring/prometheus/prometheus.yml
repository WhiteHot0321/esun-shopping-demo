# Prometheus for the single-host production stack (docker-compose.monitoring.yml).
# The backend's management listener (port 8081) is reachable only on the internal Docker network; it is never
# published. See docs/runbook-incident.md for what each alert means and what to do.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: esun-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8081"]
