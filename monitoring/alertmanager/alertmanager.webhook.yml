# Alertmanager with webhook delivery. Selected only by the opt-in overlay docker-compose.alerting.yml; the default
# alertmanager.yml has no receiver. The URL is never in this file: it is read at send time from a Compose secret
# (/run/secrets/alert_webhook_url) whose host path comes from ALERT_WEBHOOK_URL_FILE. See docs/runbook-incident.md.
#
# The route and inhibit_rules below must stay identical to alertmanager.yml; scripts/test/monitoring-config.test.sh
# fails if they drift.
route:
  receiver: default
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    webhook_configs:
      - url_file: /run/secrets/alert_webhook_url
        send_resolved: true
        max_alerts: 20

# A dead backend explains most warning-level symptoms; page once, not for every symptom.
inhibit_rules:
  - source_matchers: [alertname="BackendDown"]
    target_matchers: [severity="warning"]
