# Alertmanager default: no notification destination. A real webhook URL, chat token or e-mail password is a secret
# and must never be committed. Alerts still fire, are grouped, and are visible in the Alertmanager UI and Prometheus
# (/alerts). To deliver notifications, add the opt-in overlay docker-compose.alerting.yml with ALERT_WEBHOOK_URL_FILE
# pointing at a host file that holds the URL; it switches to alertmanager.webhook.yml (same route, webhook receiver).
#
# The route and inhibit_rules below must stay identical to alertmanager.webhook.yml; scripts/test/monitoring-config.test.sh
# fails if they drift.
route:
  receiver: default
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default

# A dead backend explains most warning-level symptoms; page once, not for every symptom.
inhibit_rules:
  - source_matchers: [alertname="BackendDown"]
    target_matchers: [severity="warning"]
