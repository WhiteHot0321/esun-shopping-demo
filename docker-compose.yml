version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: esun-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: ${DB_NAME:-esun_shop}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - ./backend/DB:/docker-entrypoint-initdb.d
  redis:
    image: redis:7
    container_name: esun-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
