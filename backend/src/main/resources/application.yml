server:
  port: ${SERVER_PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 500ms
      timeout: 500ms
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:esun_shop}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Taipei&characterEncoding=utf8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Taipei

jwt:
  # Dev-only fallback secret (must be >= 32 bytes for HS256) - override with the JWT_SECRET
  # env var in any real deployment, the same pattern already used for DB_* below it in
  # docker-compose.yml.
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-32bytes}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

payment:
  # HMAC key that authenticates payment-provider callbacks. Dev-only fallback: override with PAYMENT_CALLBACK_SECRET
  # in any real deployment (same pattern as jwt.secret).
  callback-secret: ${PAYMENT_CALLBACK_SECRET:dev-only-insecure-payment-secret-change-me}
  sandbox:
    # Off by default: in sandbox mode a buyer can report "paid" for their own order. Set PAYMENT_SANDBOX_ENABLED=true
    # for local development/demos only; with it off no payment can be started and callbacks are rejected (503).
    enabled: ${PAYMENT_SANDBOX_ENABLED:false}

stock:
  redis:
    enabled: ${STOCK_REDIS_ENABLED:false}

product:
  images:
    directory: ${PRODUCT_IMAGE_DIRECTORY:uploads/products}

llm:
  provider: ${LLM_PROVIDER:ollama}
  indexing:
    enabled: ${LLM_INDEXING_ENABLED:true}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    chat-model: ${OLLAMA_CHAT_MODEL:llama3.1}
    embed-model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
    timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:30}
  claude:
    api-key: ${ANTHROPIC_API_KEY:}
    chat-model: claude-sonnet-5
  rag:
    top-k: ${RAG_TOP_K:4}
