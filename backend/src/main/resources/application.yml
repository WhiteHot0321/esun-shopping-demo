server:
  port: ${SERVER_PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 500ms
      timeout: 500ms
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:esun_shop}?useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=Asia/Taipei&characterEncoding=utf8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Taipei

# OpenAPI spec (/v3/api-docs) and Swagger UI (/swagger-ui.html). Public routes (no JWT, see JwtAuthFilter) so a
# maintainer can open them in a browser; set API_DOCS_ENABLED=false in production to remove the endpoints (404).
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    operations-sorter: alpha
    tags-sorter: alpha

# Browser origins allowed to call /api (comma-separated). Dev default is the Vite dev server; the prod profile
# has no default and refuses to start without it. Applied by a servlet filter that runs before JwtAuthFilter.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Phase 3.3 #18: health probes for container healthchecks / deploy gates. Only /actuator/health is exposed, with no
# details; liveness has no dependencies and readiness needs the database. Redis is deliberately NOT a health
# dependency - the stock cache degrades to the database by design, so a Redis outage must not fail a deploy gate
# or restart the app. The prod profile moves these endpoints to a separate, unpublished management port.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  health:
    redis:
      enabled: false

jwt:
  # Dev-only fallback secret (must be >= 32 bytes for HS256) - override with the JWT_SECRET
  # env var in any real deployment, the same pattern already used for DB_* below it in
  # docker-compose.yml.
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-32bytes}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

payment:
  # HMAC key that authenticates payment-provider callbacks. Dev-only fallback: override with PAYMENT_CALLBACK_SECRET
  # in any real deployment (same pattern as jwt.secret).
  callback-secret: ${PAYMENT_CALLBACK_SECRET:dev-only-insecure-payment-secret-change-me}
  # none (default): no payment can start and every callback is refused (503).
  # sandbox: a buyer can report "paid" for their own order - local development/demos ONLY, never production.
  # ecpay: real ECPay AioCheckOut (credit card); needs the ecpay.* settings below.
  provider: ${PAYMENT_PROVIDER:none}

# Secrets come only from the environment; ECPay's public stage test account is documented in docs/tasks/035.
ecpay:
  merchant-id: ${ECPAY_MERCHANT_ID:}
  hash-key: ${ECPAY_HASH_KEY:}
  hash-iv: ${ECPAY_HASH_IV:}
  payment-url: ${ECPAY_PAYMENT_URL:}
  callback-url: ${ECPAY_CALLBACK_URL:}
  return-url: ${ECPAY_RETURN_URL:}

stock:
  redis:
    enabled: ${STOCK_REDIS_ENABLED:false}

product:
  images:
    directory: ${PRODUCT_IMAGE_DIRECTORY:uploads/products}

llm:
  provider: ${LLM_PROVIDER:ollama}
  indexing:
    enabled: ${LLM_INDEXING_ENABLED:true}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    chat-model: ${OLLAMA_CHAT_MODEL:llama3.1}
    embed-model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
    timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:30}
  claude:
    api-key: ${ANTHROPIC_API_KEY:}
    chat-model: claude-sonnet-5
  rag:
    top-k: ${RAG_TOP_K:4}
