# Production profile (SPRING_PROFILES_ACTIVE=prod). Anything security-relevant has NO default here: a missing
# environment variable fails startup instead of silently falling back to the well-known dev value in application.yml.
# ProductionConfigValidator additionally rejects weak or dev-only values that were set explicitly.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=Asia/Taipei&characterEncoding=utf8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD:}

jwt:
  secret: ${JWT_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

payment:
  # No defaults: prod must state its payment mode and callback secret explicitly (PAYMENT_PROVIDER=none|ecpay;
  # PAYMENT_CALLBACK_SECRET may be set empty only when the provider is none - the validator requires it for ecpay).
  callback-secret: ${PAYMENT_CALLBACK_SECRET}
  provider: ${PAYMENT_PROVIDER}

management:
  server:
    # Safe default for a single-container healthcheck/sidecar. For cross-container monitoring, explicitly set
    # MANAGEMENT_ADDRESS=0.0.0.0 and keep MANAGEMENT_PORT unpublished from the host/public network; a separate port
    # alone is not an access-control boundary.
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
    port: ${MANAGEMENT_PORT:8081}
