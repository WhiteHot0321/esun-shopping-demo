[project]
name = "esun-ops"
version = "1.0.0"
description = "ESUN Shopping Demo 的維運與驗證工具箱"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32,<3",
    "PyMySQL>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9"]

[project.scripts]
esun-ops = "esun_ops.cli:main"

[tool.pytest.ini_options]
# 讓 tests/ 直接 import esun_ops，不必先安裝套件
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
