# Vulnerability exceptions for the CI supply-chain gate (docs/tasks/063). The gate fails on HIGH/CRITICAL findings that
# have a fix available; an entry here is the ONLY way to accept one, and every entry must state why, who owns it, and
# an expiry so it cannot become permanent by accident:
#
# vulnerabilities:
#   - id: CVE-YYYY-NNNNN
#     paths: ["path/inside/the/image"]     # scope the exception to the one binary it was assessed for
#     statement: "Not reachable because ...; owner: <name>; tracking: <issue link>"
#     expired_at: 2026-12-31
#
# expired_at must be a bare YYYY-MM-DD date. CI runs scripts/check-trivy-expiry.sh (docs/tasks/086): it annotates an entry 14
# days before it expires, and fails the build only when it cannot read an entry's date.
#
# 2026-11-16 renewal (docs/tasks/083). The 2026-10-22 batch is resolved by upstream rebuilds and its entries are removed:
#  - usr/bin/caddy (CVE-2026-78669, -78667, -97031, -111943): caddy:2-alpine is now Caddy v2.11.9; no longer reported.
#  - usr/bin/pebble (same four CVEs): eclipse-temurin:17-jre was rebuilt (17.0.21, Ubuntu 26.04.1); no longer reported.
# Both Dockerfiles use floating base tags, so a fresh build picks the fixed bases up without a repository change.
# What is left with pinned Trivy v0.74.0 and an empty ignore file is exactly the three entries below.
vulnerabilities:
  # Spring Framework 6.2.19 is still the newest 6.2.x and Spring Boot 3.5.16 the newest 3.5.x on Maven Central (checked
  # 2026-11-16); Trivy lists the fix only in 7.0.9. Closing these means the Spring Boot 4 / Framework 7 migration.
  - id: CVE-2026-47884
    paths: ["app/app.jar/BOOT-INF/lib/spring-webmvc-*.jar"]
    statement: >-
      NOT REACHABLE (re-checked 2026-11-16). Needs XsltView in a Spring MVC app with a "/**" mapping that renders views. This
      application has no view layer: all 14 controllers are @RestController (none uses @Controller), there is no ViewResolver,
      ModelAndView, template engine dependency, src/main/resources/templates or XSLT. No 6.2.x fix exists (fixed only in
      7.0.9). Re-assess if a view layer is ever added; plan the Spring Framework 7 migration.
      owner: WhiteHot0321; tracking: docs/tasks/083
    expired_at: 2026-12-14
  - id: CVE-2026-47890
    paths: ["app/app.jar/BOOT-INF/lib/spring-webmvc-*.jar"]
    statement: >-
      NOT REACHABLE (re-checked 2026-11-16). Needs Server-Sent Events rendered with view fragments. The application uses no
      SSE (no SseEmitter, ResponseBodyEmitter, text/event-stream or webflux) and has no template/view layer. No 6.2.x fix
      exists (fixed only in 7.0.9). owner: WhiteHot0321; tracking: docs/tasks/083
    expired_at: 2026-12-14
  # New on 2026-11-16, renewed 2026-11-26 (docs/tasks/087): Caddy v2.11.9 (the newest release, published 2026-11-05, and the
  # current caddy:2-alpine) is built with x/net 0.60.0; the fix is in 0.62.0. Re-checked 2026-11-26 with a `--pull` rebuild:
  # still v2.11.9 / x/net 0.60.0 and still reported. Caddy's master branch already requires x/net 0.62.0 but no release carries
  # it yet. Short expiry: remove as soon as a newer Caddy image makes the gate pass without it.
  - id: CVE-2026-78661
    paths: ["usr/bin/caddy"]
    statement: >-
      NOT REACHABLE in this configuration; availability only if it were (re-checked 2026-11-26). Quadratic CPU/allocation in the golang.org/x/net/html
      parser on crafted HTML. frontend/Caddyfile adapts to the handlers encode, headers, rewrite, vars, reverse_proxy and
      file_server only (`caddy adapt`); these stream request and response bodies and none parses HTML (no templates, no
      file_server browse). The parser is linked into the binary, but which Caddy module calls it was not identified, so
      re-assess if any other handler is added. Container is memory-limited with restart: unless-stopped.
      owner: WhiteHot0321; tracking: docs/tasks/087
    expired_at: 2026-12-14
