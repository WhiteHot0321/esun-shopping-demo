# Production topology (Phase 3.3 #18 B2): single-VM Docker Compose stack behind Caddy.
# Only `caddy` publishes ports (80/443); everything else is reachable only on the internal
# Docker network. Values come from a real, git-ignored `.env.prod` — copy `.env.prod.example`
# and fill it in; never commit real values. See docs/tasks/057 for what each variable needs.
#
# Local acceptance (no real VM/domain yet):
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up --build
#   -> https://localhost uses Caddy's internal, self-signed CA (DOMAIN defaults to localhost).
#
# Real deployment (B3): set BACKEND_IMAGE/FRONTEND_IMAGE to the GHCR commit-SHA tags and run
# `docker compose -f docker-compose.prod.yml --env-file .env.prod pull && ... up -d` instead of
# building locally, and set DOMAIN to the real public hostname (e.g. whitehot0321.duckdns.org).
version: '3.8'

services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql-data:/var/lib/mysql
    # No docker-entrypoint-initdb.d mount here on purpose: Flyway (FLYWAY_ENABLED=true below)
    # owns schema creation/migration in this topology, not the legacy backend/DB/*.sql chain.
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]
    # The image starts as root, fixes data-dir ownership, then drops to the mysql user: keep only what that needs.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    networks: [data]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    # Pull the configured models once after first boot (not automated here):
    #   docker compose -f docker-compose.prod.yml exec ollama ollama pull llama3.1
    #   docker compose -f docker-compose.prod.yml exec ollama ollama pull nomic-embed-text

  backend:
    build:
      context: ./backend
    image: ${BACKEND_IMAGE:-esun-shopping-backend:local}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-XX:MaxRAMPercentage=75"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USE_SSL: "false"
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      STOCK_REDIS_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-none}
      PAYMENT_CALLBACK_SECRET: ${PAYMENT_CALLBACK_SECRET:-}
      API_DOCS_ENABLED: "false"
      FLYWAY_ENABLED: "true"
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.1}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    volumes:
      - product-images:/app/uploads
    networks: [edge, data]
    # Non-root already (see backend/Dockerfile); also no capabilities and a read-only root filesystem. The JVM and
    # Tomcat write only to /tmp (tmpfs) and the uploads volume.
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 512
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  caddy:
    build:
      context: ./frontend
    image: ${FRONTEND_IMAGE:-esun-shopping-frontend:local}
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-0}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    depends_on:
      - backend
    restart: unless-stopped

# edge: Caddy <-> backend only. data: backend <-> MySQL/Redis/Ollama. Caddy cannot reach the data services.
networks:
  edge:
  data:

volumes:
  mysql-data:
  redis-data:
  ollama-data:
  product-images:
  caddy-data:
  caddy-config:
