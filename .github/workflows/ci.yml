name: CI

on:
  push:
    branches: [main, advanced-v2]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to the same ref supersedes the run in progress (saves runner minutes);
# never cancel a run on a protected branch or tag, so an image push is not cut in half.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/advanced-v2' && !startsWith(github.ref, 'refs/tags/') }}

# Least privilege by default; the publish job widens this for itself only.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Testcontainers needs the runner's Docker daemon (present on ubuntu-latest).
      # `mvn test` also runs the JaCoCo check (>=80% lines on the four core services).
      - name: Run backend tests + coverage gate
        working-directory: backend
        run: mvn -B test
      # Run logs need a signed-in viewer, annotations do not: surface each failing test class with its first lines of output.
      - name: Surface failing tests as annotations
        if: failure()
        run: |
          for f in backend/target/surefire-reports/*.txt; do
            [ -e "$f" ] || continue
            grep -q -E 'FAILURE!|ERROR!' "$f" || continue
            msg=$(head -c 1800 "$f" | tr -d '\r' | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Failing test class $(basename "$f" .txt)::$msg"
          done
      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports
            backend/target/site/jacoco
          retention-days: 14
          if-no-files-found: ignore

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      # Runtime dependencies only: vite/vitest tooling is build-time and is not shipped. Blocking at high and above.
      - name: Audit frontend runtime dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # Supply-chain gate (docs/tasks/063). Pinned by commit SHA because it is third-party code that runs with our repo checked
  # out. The self-test proves the gate still fails on a known-vulnerable fixture, so a scanner that silently stops
  # working cannot turn this job green. Exceptions live in .trivyignore.yaml and need an owner and an expiry.
  supply-chain-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
      - name: Gate self-test (the known-vulnerable fixture must be rejected)
        run: |
          set +e
          out=$(trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .github/security-fixtures/vulnerable-npm 2>&1)
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::the vulnerability gate did not fail on the known-vulnerable fixture"; exit 1
          fi
          # A crash also exits non-zero: require an actual finding so a broken scanner cannot pass this self-test.
          echo "$out" | grep -q "CVE-" || { echo "$out"; echo "::error::gate failed but reported no CVE finding (scanner error?)"; exit 1; }
      # backend/pom.xml is skipped here on purpose: Trivy would resolve it against Maven Central (rate limited);
      # backend dependencies are gated through the image scan below, which reads the built jar.
      - name: Scan repository for vulnerabilities and secrets
        run: >
          trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --ignorefile .trivyignore.yaml --skip-files backend/pom.xml
          --skip-dirs .github/security-fixtures --skip-dirs node_modules --skip-dirs backend/target .

  # Static validation of the deployment files (docs/tasks/064): Compose merges cleanly with every overlay and the Caddyfile parses.
  config-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose files (dummy, non-secret values)
        run: |
          cat > ci.env <<'EOF'
          DB_NAME=ci
          DB_PASSWORD=ci-not-a-secret
          APP_DB_PASSWORD=ci-not-a-secret
          REDIS_PASSWORD=ci-not-a-secret
          JWT_SECRET=ci-not-a-secret
          CORS_ALLOWED_ORIGINS=https://ci.example.com
          PAYMENT_PROVIDER=none
          GRAFANA_ADMIN_PASSWORD=ci-not-a-secret
          CLOUDFLARE_TUNNEL_TOKEN=ci-not-a-secret
          EOF
          docker compose -f docker-compose.prod.yml --env-file ci.env config -q
          docker compose -f docker-compose.prod.yml -f docker-compose.tunnel.yml --env-file ci.env config -q
          docker compose -f docker-compose.prod.yml -f docker-compose.tunnel.yml -f docker-compose.monitoring.yml --env-file ci.env config -q
          docker compose -f docker-compose.prod.yml -f docker-compose.tunnel.yml -f docker-compose.cloudflared.yml --env-file ci.env config -q
      - name: Validate the Caddyfile
        run: >
          docker run --rm -v "$PWD/frontend/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  # The deploy scripts run on a production host with a Docker socket; their guards (ancestry, revision label, rollback without
  # migrate, forced-command parsing) are exercised against stubs here (docs/tasks/075). shellcheck is preinstalled on the runner.
  deploy-script-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lint the deploy scripts
        run: |
          for f in scripts/deploy-vm.sh scripts/esun-deploy-entry scripts/vm-bootstrap.sh scripts/test/deploy-vm.test.sh; do bash -n "$f"; done
          shellcheck -x scripts/deploy-vm.sh scripts/esun-deploy-entry scripts/vm-bootstrap.sh scripts/test/deploy-vm.test.sh
      - name: Run the stubbed deploy tests
        run: bash scripts/test/deploy-vm.test.sh

  docker-build:
    needs: [backend-test, frontend-build, supply-chain-gate, config-validate, deploy-script-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only (no push) so pull requests and forks verify the image without credentials.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          load: true
          tags: esun-shopping-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          load: true
          tags: esun-shopping-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
      # Reads OS packages and the jars inside the image, so this is also the backend (Maven) dependency gate.
      - name: Scan backend image (blocking on fixable HIGH/CRITICAL)
        run: >
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --ignorefile .trivyignore.yaml esun-shopping-backend:${{ github.sha }}
      # The frontend image is what Caddy runs in production: same gate, base image caddy:2-alpine included.
      - name: Scan frontend image (blocking on fixable HIGH/CRITICAL)
        run: >
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --ignorefile .trivyignore.yaml esun-shopping-frontend:${{ github.sha }}

  # Publishes backend and frontend to GHCR with the built-in GITHUB_TOKEN (no stored secret). Runs only after every gate
  # above is green, for pushes to main / advanced-v2 or a v* tag, and for a manual run on advanced-v2 (the deploy job needs
  # it) - never for pull requests. Its two digest outputs are the only images the deploy job may promote: the job is
  # green only if both digests also passed the digest scan below.
  publish-image:
    needs: [docker-build]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/advanced-v2' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/advanced-v2')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      backend_digest: ${{ steps.push_backend.outputs.digest }}
      frontend_digest: ${{ steps.push_frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long
      - id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long
      # sbom + provenance attach BuildKit attestations to the pushed manifest, so they travel with the digest. The labels from
      # metadata-action include org.opencontainers.image.revision=<commit>, which the VM compares with the sha it deploys.
      - name: Build and push backend image
        id: push_backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and push frontend image
        id: push_frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
      # A registry reference must be lowercase; github.repository keeps the owner's capitalisation (docker/metadata-action lowercases its tags).
      - name: Resolve the pushed digest references
        run: |
          echo "BACKEND_REF=${IMAGE,,}@${{ steps.push_backend.outputs.digest }}" >> "$GITHUB_ENV"
          echo "FRONTEND_REF=${FRONTEND_IMAGE,,}@${{ steps.push_frontend.outputs.digest }}" >> "$GITHUB_ENV"
      # Scan the digests that can actually be promoted, not separate rebuilds. A failure here means the digest must not be
      # deployed even though its tags already exist; the deploy job only runs when this whole job is green.
      - name: Scan the published backend digest
        run: >
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --ignorefile .trivyignore.yaml "$BACKEND_REF"
      - name: Scan the published frontend digest
        run: >
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --ignorefile .trivyignore.yaml "$FRONTEND_REF"
      # Artifact names cannot contain ':', so the name carries the commit and the file names carry the digests.
      - name: Generate CycloneDX SBOMs for the digests
        run: |
          backend_digest="${{ steps.push_backend.outputs.digest }}"
          frontend_digest="${{ steps.push_frontend.outputs.digest }}"
          trivy image --format cyclonedx --output "sbom-backend-${backend_digest#sha256:}.cdx.json" "$BACKEND_REF"
          trivy image --format cyclonedx --output "sbom-frontend-${frontend_digest#sha256:}.cdx.json" "$FRONTEND_REF"
      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom-*.cdx.json
          retention-days: 90
      - name: Record digests
        run: |
          echo "Published $BACKEND_REF" >> "$GITHUB_STEP_SUMMARY"
          echo "Published $FRONTEND_REF" >> "$GITHUB_STEP_SUMMARY"

  # Production deploy (docs/tasks/075). Only advanced-v2 (push or manual run), only after publish-image is green, and only the
  # two digests that job published and scanned. `environment: production` is where the owner's approval happens (Required
  # reviewers, deployment branches limited to advanced-v2). The job holds no repository write access and checks nothing out:
  # it speaks SSH to the VM with a key that can run exactly one forced command (scripts/esun-deploy-entry). Application secrets
  # are never here; they exist only in the VM's .env.prod. Everything the VM prints goes to this public log, and deploy-vm.sh
  # is written to print none.
  deploy:
    needs: [publish-image]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/advanced-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Deploy to the VM
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ github.sha }}
          BACKEND_DIGEST: ${{ needs.publish-image.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ needs.publish-image.outputs.frontend_digest }}
        run: |
          set -euo pipefail
          sha_re='^[0-9a-f]{40}$'
          digest_re='^sha256:[0-9a-f]{64}$'
          [[ "$DEPLOY_SHA" =~ $sha_re ]] || { echo "::error::unexpected commit sha"; exit 1; }
          [[ "$BACKEND_DIGEST" =~ $digest_re && "$FRONTEND_DIGEST" =~ $digest_re ]] || { echo "::error::publish-image did not produce two valid digests"; exit 1; }
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::the production Environment needs DEPLOY_SSH_KEY and DEPLOY_HOST (secrets) and DEPLOY_KNOWN_HOSTS (variable)"; exit 1
          fi
          umask 077
          ssh_dir="$RUNNER_TEMP/ssh"
          mkdir -p "$ssh_dir"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$ssh_dir/known_hosts"
          # The host key comes from DEPLOY_KNOWN_HOSTS (obtained out of band) and is verified strictly: no ssh-keyscan, no
          # trust-on-first-use, no system known_hosts. The command string is validated again by the VM's forced command.
          rc=0
          ssh -T -i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            "deploy@${DEPLOY_HOST}" "deploy $DEPLOY_SHA $BACKEND_DIGEST $FRONTEND_DIGEST" || rc=$?
          {
            echo "### Deploy"
            echo "- commit: \`$DEPLOY_SHA\`"
            echo "- backend: \`$BACKEND_DIGEST\`"
            echo "- frontend: \`$FRONTEND_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$rc" in
            0)  echo "- result: deployed, health gate passed" >> "$GITHUB_STEP_SUMMARY" ;;
            10) echo "::error::health gate failed; the VM rolled back to the previous version and is healthy"; echo "- result: FAILED, rolled back" >> "$GITHUB_STEP_SUMMARY" ;;
            11) echo "::error::health gate failed AND the rollback failed; the VM needs manual attention"; echo "- result: FAILED, rollback failed" >> "$GITHUB_STEP_SUMMARY" ;;
            12) echo "::error::first deploy failed; there was no previous version to roll back to"; echo "- result: FAILED (first deploy)" >> "$GITHUB_STEP_SUMMARY" ;;
            *)  echo "::error::deploy refused or SSH failed (exit $rc); nothing was started on the VM unless the log above says otherwise"; echo "- result: refused or unreachable (exit $rc)" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          exit "$rc"
