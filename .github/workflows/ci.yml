name: CI

on:
  push:
    branches: [main, advanced-v2]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to the same ref supersedes the run in progress (saves runner minutes);
# never cancel a run on a protected branch or tag, so an image push is not cut in half.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/advanced-v2' && !startsWith(github.ref, 'refs/tags/') }}

# Least privilege by default; the publish job widens this for itself only.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}/backend

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Testcontainers needs the runner's Docker daemon (present on ubuntu-latest).
      # `mvn test` also runs the JaCoCo check (>=80% lines on the four core services).
      - name: Run backend tests + coverage gate
        working-directory: backend
        run: mvn -B test
      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports
            backend/target/site/jacoco
          retention-days: 14
          if-no-files-found: ignore

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only (no push) so pull requests and forks verify the image without credentials.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: esun-shopping-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publishes to GHCR with the built-in GITHUB_TOKEN (no stored secret). Runs only after every
  # gate above is green, and only for pushes to main / advanced-v2 or a v* tag - never for
  # pull requests. There is deliberately no deploy step: no deployment target is chosen yet.
  publish-image:
    needs: [docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/advanced-v2' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
