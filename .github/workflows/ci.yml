name: CI

on:
  push:
    branches: [main, advanced-v2]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to the same ref supersedes the run in progress (saves runner minutes);
# never cancel a run on a protected branch or tag, so an image push is not cut in half.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/advanced-v2' && !startsWith(github.ref, 'refs/tags/') }}

# Least privilege by default; the publish job widens this for itself only.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}/backend

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Testcontainers needs the runner's Docker daemon (present on ubuntu-latest).
      # `mvn test` also runs the JaCoCo check (>=80% lines on the four core services).
      - name: Run backend tests + coverage gate
        working-directory: backend
        run: mvn -B test
      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports
            backend/target/site/jacoco
          retention-days: 14
          if-no-files-found: ignore

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      # Runtime dependencies only: vite/vitest tooling is build-time and is not shipped. Blocking at high and above.
      - name: Audit frontend runtime dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # Supply-chain gate (docs/tasks/063). Pinned by commit SHA because it is third-party code that runs with our repo checked
  # out. The self-test proves the gate still fails on a known-vulnerable fixture, so a scanner that silently stops
  # working cannot turn this job green. Exceptions live in .trivyignore.yaml and need an owner and an expiry.
  supply-chain-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
      - name: Gate self-test (the known-vulnerable fixture must be rejected)
        run: |
          if trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --quiet .github/security-fixtures/vulnerable-npm; then
            echo "::error::the vulnerability gate did not fail on the known-vulnerable fixture"
            exit 1
          fi
      # backend/pom.xml is skipped here on purpose: Trivy would resolve it against Maven Central (rate limited);
      # backend dependencies are gated through the image scan below, which reads the built jar.
      - name: Scan repository for vulnerabilities and secrets
        run: >
          trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --ignorefile .trivyignore.yaml --skip-files backend/pom.xml
          --skip-dirs .github/security-fixtures --skip-dirs node_modules --skip-dirs backend/target .

  docker-build:
    needs: [backend-test, frontend-build, supply-chain-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only (no push) so pull requests and forks verify the image without credentials.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          load: true
          tags: esun-shopping-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
      # Reads OS packages and the jars inside the image, so this is also the backend (Maven) dependency gate.
      - name: Scan backend image (blocking on fixable HIGH/CRITICAL)
        run: >
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --ignorefile .trivyignore.yaml esun-shopping-backend:${{ github.sha }}

  # Publishes to GHCR with the built-in GITHUB_TOKEN (no stored secret). Runs only after every
  # gate above is green, and only for pushes to main / advanced-v2 or a v* tag - never for
  # pull requests. There is deliberately no deploy step: no deployment target is chosen yet.
  publish-image:
    needs: [docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/advanced-v2' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long
      # sbom + provenance attach BuildKit attestations to the pushed manifest, so they travel with the digest.
      - name: Build and push backend image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
      # A registry reference must be lowercase; github.repository keeps the owner's capitalisation (docker/metadata-action lowercases its tags).
      - name: Resolve the pushed digest reference
        run: echo "IMAGE_REF=${IMAGE,,}@${{ steps.push.outputs.digest }}" >> "$GITHUB_ENV"
      # Scan the digest that can actually be promoted, not a separate rebuild. A failure here means this digest must not
      # be deployed even though its tags already exist; deploy tooling must promote only digests whose run is green.
      - name: Scan the published digest
        run: >
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --ignorefile .trivyignore.yaml "$IMAGE_REF"
      - name: Generate CycloneDX SBOM for the digest
        run: >
          trivy image --format cyclonedx --output sbom.cdx.json "$IMAGE_REF"
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ steps.push.outputs.digest }}
          path: sbom.cdx.json
          retention-days: 90
      - name: Record digest
        run: echo "Published $IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"
